<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/assets/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="팬오션 협력업체 안전보건 DX 포털" />
    <title>팬오션 안전보건 DX</title>
  </head>
  <body>
    <div id="root"></div>
    <!-- QR 파라미터 감지 → /qr/:token 으로 리다이렉트 (ngrok 인터스티셜 우회용) -->
    <script>
      (function() {
        var qr = new URLSearchParams(window.location.search).get('qr');
        if (qr && /^[a-f0-9]{32}$/.test(qr)) {
          window.location.replace('/qr/' + qr);
        }
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
