<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/assets/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="팬오션 협력업체 안전보건 DX 포털" />
    <title>팬오션 안전보건 DX</title>
    <style>
      @media print {
        body * { visibility: hidden; }
        #certificate-print, #certificate-print * { visibility: visible; }
        #certificate-print { position: absolute; left: 0; top: 0; width: 100%; }
      }
    </style>
    <script src="//t1.daumcdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <!-- QR/업로드 파라미터 감지 → 해당 경로로 리다이렉트 (ngrok 인터스티셜 우회용) -->
    <script>
      (function() {
        var params = new URLSearchParams(window.location.search);
        var qr = params.get('qr');
        if (qr && /^[a-f0-9]{32}$/.test(qr)) {
          window.location.replace('/qr/' + qr);
          return;
        }
        var upload = params.get('upload');
        if (upload && /^[a-f0-9]{32}$/.test(upload)) {
          window.location.replace('/upload/' + upload);
        }
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
